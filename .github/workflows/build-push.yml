name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker publish mode
        id: publish
        run: |
          publish_ref=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ) ]]; then
            publish_ref=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ) ]]; then
            publish_ref=true
          fi

          publish_enabled=false

          if [[ "${publish_ref}" == "true" && -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" ]]; then
            publish_enabled=true
          fi

          echo "publish_ref=${publish_ref}" >> "${GITHUB_OUTPUT}"
          echo "publish_enabled=${publish_enabled}" >> "${GITHUB_OUTPUT}"

          if [[ "${publish_ref}" == "true" && "${publish_enabled}" == "false" ]]; then
            echo "::warning title=Skipping Docker publish::Docker Hub credentials are unavailable, so the workflow will run a local image build without pushing."
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.publish.outputs.publish_enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: ${{ steps.publish.outputs.publish_enabled == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_USERNAME }}/mas
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: ${{ steps.publish.outputs.publish_enabled == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image without publishing
        if: ${{ steps.publish.outputs.publish_enabled != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
